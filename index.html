<!DOCTYPE html>
<html>
<head>
  <title>3D Solid Figures for Kids</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Comic Sans MS, Arial;
      background: linear-gradient(to bottom, #aee1ff, #ffffff);
    }
    #title {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #ff4081;
      text-shadow: 2px 2px white;
    }
    #instructions {
      position: absolute;
      top: 50px;
      width: 100%;
      text-align: center;
      font-size: 16px;
      color: #333;
    }
  </style>
</head>
<body>
<div id="title">🌟 Explore 3D Solid Figures 🌟</div>
<div id="instructions">
Touch and drag each shape to rotate it in 3D!
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// Scene & Camera
let scene = new THREE.Scene();
scene.background = new THREE.Color(0xaee1ff);

let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 25);

// Renderer
let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lights
let light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10, 20, 15);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

// Materials
function createMaterial(color){
  return new THREE.MeshStandardMaterial({color: color, roughness:0.4, metalness:0.1});
}

// Shapes array
let shapes = [];

// Function to add shape
function addShape(geometry, color, x, y){
  let mesh = new THREE.Mesh(geometry, createMaterial(color));
  mesh.position.set(x,y,0);
  scene.add(mesh);
  shapes.push(mesh);
}

// Function to position shapes dynamically
function positionShapes(){
  let spacingX = window.innerWidth / 200; // adjust spacing based on screen width
  let spacingY = window.innerHeight / 60; // adjust vertical spacing

  // Top row
  shapes[0].position.set(-spacingX, spacingY, 0); // Cube
  shapes[1].position.set(0, spacingY, 0);         // Rectangular Prism
  shapes[2].position.set(spacingX, spacingY, 0);  // Sphere

  // Bottom row
  shapes[3].position.set(-spacingX, -spacingY, 0); // Cylinder
  shapes[4].position.set(0, -spacingY, 0);         // Cone
  shapes[5].position.set(spacingX, -spacingY, 0);  // Pyramid
}

// Add shapes
shapes.push(new THREE.Mesh(new THREE.BoxGeometry(3,3,3), createMaterial(0xff6f61)));   // Cube
shapes.push(new THREE.Mesh(new THREE.BoxGeometry(4,3,2), createMaterial(0xffc107)));   // Rectangular Prism
shapes.push(new THREE.Mesh(new THREE.SphereGeometry(2,32,32), createMaterial(0x4caf50))); // Sphere
shapes.push(new THREE.Mesh(new THREE.CylinderGeometry(2,2,4,32), createMaterial(0x2196f3))); // Cylinder
shapes.push(new THREE.Mesh(new THREE.ConeGeometry(2,4,32), createMaterial(0x9c27b0)));       // Cone
shapes.push(new THREE.Mesh(new THREE.ConeGeometry(2,4,4), createMaterial(0xff9800)));       // Pyramid

shapes.forEach(s => scene.add(s));

positionShapes();

// Raycaster for grabbing shapes
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let selected = null;
let prevX = 0;
let prevY = 0;
let isDragging = false;

// Get pointer coordinates (works for mouse or touch)
function getPointer(event){
  if(event.touches){
    return {x:event.touches[0].clientX, y:event.touches[0].clientY};
  } else {
    return {x:event.clientX, y:event.clientY};
  }
}

// Pointer down
function onPointerDown(event){
  let pointer = getPointer(event);
  mouse.x = (pointer.x / window.innerWidth) * 2 - 1;
  mouse.y = -(pointer.y / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  let intersects = raycaster.intersectObjects(shapes);
  if(intersects.length > 0){
    selected = intersects[0].object;
    isDragging = true;
    prevX = pointer.x;
    prevY = pointer.y;
  }
  event.preventDefault();
}

// Pointer move
function onPointerMove(event){
  if(isDragging && selected){
    let pointer = getPointer(event);
    let deltaX = pointer.x - prevX;
    let deltaY = pointer.y - prevY;
    selected.rotation.y += deltaX * 0.01;
    selected.rotation.x += deltaY * 0.01;
    prevX = pointer.x;
    prevY = pointer.y;
  }
  event.preventDefault();
}

// Pointer up
function onPointerUp(event){
  isDragging = false;
  selected = null;
  event.preventDefault();
}

// Event listeners for desktop + mobile
window.addEventListener('mousedown', onPointerDown, false);
window.addEventListener('mousemove', onPointerMove, false);
window.addEventListener('mouseup', onPointerUp, false);

window.addEventListener('touchstart', onPointerDown, false);
window.addEventListener('touchmove', onPointerMove, false);
window.addEventListener('touchend', onPointerUp, false);

// Animate
function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

animate();

// Resize and orientation change
function onResize(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  positionShapes(); // reposition shapes to keep centered
}

window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

</script>
</body>
</html>
